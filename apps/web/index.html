<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A+ W3 PWA: SVG favicon for browsers that prefer vector + PNG fallback
         for older toolchains. iOS home-screen reads /apple-touch-icon.png
         directly; the manifest supplies all other sizes. -->
    <link rel="icon" type="image/svg+xml" href="/foldo-mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="alternate icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/foldo-mark.svg" color="#FDB306" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FDB306" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1014" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Multiplayer review canvas for AI-generated code. Pin comments to pixels, dispatch edits to Claude Code, watch the result land back on the board." />
    <!-- A+W1 touch: viewport-fit=cover gives us safe-area-inset on notch devices;
         user-scalable=no stops iOS from auto-zooming the whole app on a double-tap
         (canvas owns its own pinch handling). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!-- A+ W3 PWA: full iOS standalone metadata. `apple-mobile-web-app-title`
         is what shows under the home-screen icon (defaults to <title>, which
         would be the long one). `black-translucent` lets the canvas paint
         under the status bar — combined with env(safe-area-inset-top) on
         absolute overlays it gives the proper Figma-on-iPad feel. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Foldo" />
    <meta name="format-detection" content="telephone=no" />

    <!-- A+ W3 PWA: iPad splash screens. iOS picks the matching one off the
         device's pixel-perfect width/height + DPR. Generated by
         `node scripts/gen-pwa-assets.mjs`; keep the media queries in sync
         with the SPLASH_TARGETS list in that script if you add sizes. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-2048x2732.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-1668x2388.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-1640x2360.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-1488x2266.png"
    />

    <title>Foldo — Review canvas for AI-generated code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
