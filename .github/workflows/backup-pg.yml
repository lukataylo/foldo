name: backup-pg

# Weekly Postgres dump → S3. Railway's managed Postgres has no automatic
# backups on the hobby plan; this is our backstop.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL           — Railway Postgres public connection URL (DATABASE_PUBLIC_URL)
#   AWS_ACCESS_KEY_ID      — IAM user with PutObject + ListBucket on the bucket below
#   AWS_SECRET_ACCESS_KEY  — paired secret
#   AWS_REGION             — bucket region, e.g. eu-west-2
#   FOLDO_BACKUP_BUCKET    — S3 bucket name, e.g. foldo-backups
#
# Schedule: Sundays 04:00 UTC. Manual trigger always available via Actions UI.
# Restore drill instructions: docs/DEPLOYMENT.md §7.3.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run? (audit trail in logs)'
        required: false
        default: 'manual'

permissions:
  contents: read
  # Need write to open an Issue on failure.
  issues: write

concurrency:
  group: backup-pg
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump → S3
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FOLDO_BACKUP_BUCKET: ${{ secrets.FOLDO_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: install postgresql-client (matches Railway Postgres 18 server)
        # ubuntu-latest ships with pg_dump from libpq-dev, but the version
        # is older than the Railway-hosted server. pg_dump must be >= server
        # version, so install the official PostgreSQL apt repo's pg-18 client.
        run: |
          set -euxo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: run pg_dump and upload via streaming script
        id: dump
        run: bash scripts/pg-backup.sh

      - name: verify object in S3
        run: |
          set -euo pipefail
          OBJECT_KEY="${{ steps.dump.outputs.object_key }}"
          aws s3 ls "s3://${FOLDO_BACKUP_BUCKET}/${OBJECT_KEY}"
          # Also confirm size > 1 KiB so we catch the "empty dump" failure
          # mode (e.g. when pg_dump returned 0 but produced nothing).
          SIZE_BYTES=$(aws s3api head-object \
            --bucket "${FOLDO_BACKUP_BUCKET}" \
            --key "${OBJECT_KEY}" \
            --query ContentLength --output text)
          echo "uploaded ${SIZE_BYTES} bytes"
          if [ "${SIZE_BYTES}" -lt 1024 ]; then
            echo "::error::backup is suspiciously small (<1 KiB) — failing"
            exit 1
          fi

      - name: open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[backup-pg] Weekly Postgres backup failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Backup job failed',
              '',
              `Run: ${run}`,
              `Trigger: \`${context.eventName}\``,
              '',
              'Diagnostic checklist:',
              '- `DATABASE_URL` secret valid? (rotated Railway URL?)',
              '- AWS credentials still active? Check IAM in AWS console.',
              '- Bucket `${{ secrets.FOLDO_BACKUP_BUCKET }}` exists and policy allows `PutObject`?',
              '- pg_dump version vs server version mismatch?',
              '',
              'Runbook: docs/DEPLOYMENT.md §7 and docs/RUNBOOK-INCIDENT.md.',
              '',
              'This issue is auto-opened by `.github/workflows/backup-pg.yml`.',
            ].join('\n');
            // Only open if there isn't already an open backup-pg issue from
            // the last 7 days — avoid spamming on consecutive failures.
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
              since,
            });
            if (open.data.length > 0) {
              core.notice(`existing backup-failure issue #${open.data[0].number} — appending comment instead`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Another failure: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['backup-failure', 'ops'],
              });
            }
